name: CodeQL

on:
  pull_request:
    branches: [main]
  # No push-to-main trigger: each change is analyzed on its pull request, and the
  # weekly run keeps the main-branch baseline current.
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * 0'

permissions:
  contents: read

concurrency:
  group: go-codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      # Also analyze test sources (conformance suites and examples).
      CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: ${{ hashFiles('go.sum') != '' }}
          cache-dependency-path: go.sum
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4 at research time
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4 at research time
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4 at research time
        with:
          category: /language:go
