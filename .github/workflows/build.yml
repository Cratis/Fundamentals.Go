# Validate the root and explicitly approved nested modules without local workspaces.
name: Go Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '37 4 * * 1'

permissions:
  contents: read

# A literal prefix prevents collisions when Publish calls this workflow.
concurrency:
  group: go-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  modules:
    name: Module layout and matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Test module and release policy scripts without publishing
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Enforce module allow-list and portable paths
        id: modules
        run: |
          matrix=$(python3 .github/scripts/go_modules.py matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Verify nested modules require a publicly released root
        run: python3 .github/scripts/go_modules.py dependencies

  test:
    name: Test (${{ matrix.module }}, ${{ matrix.os }}, Go ${{ matrix.go }})
    needs: modules
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        go: ['1.26.x', '1.27.x']
        module: ${{ fromJSON(needs.modules.outputs.matrix).module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: ${{ hashFiles(format('{0}/go.sum', matrix.module)) != '' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify dependency checksums
        run: go mod verify
      - name: Compile all packages
        run: go build ./...
      - name: Vet all packages
        run: go vet ./...
      - name: Test all packages
        run: go test -count=1 -timeout=2m ./...

  race:
    name: Race detector (${{ matrix.module }})
    needs: modules
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: ${{ hashFiles(format('{0}/go.sum', matrix.module)) != '' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race -count=1 -timeout=3m ./...

  lint:
    name: Go lint and module hygiene (${{ matrix.module }})
    needs: modules
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: ${{ hashFiles(format('{0}/go.sum', matrix.module)) != '' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Verify gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check tidy manifests with the minimum supported Go
        run: |
          go mod tidy
          changes=$(git status --porcelain --untracked-files=normal -- go.mod go.sum)
          if [ -n "$changes" ]; then
            printf 'Commit go mod tidy changes:\n%s\n' "$changes"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          args: --timeout=3m

  vulnerabilities:
    name: Go vulnerability check (${{ matrix.module }})
    needs: modules
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: ${{ hashFiles(format('{0}/go.sum', matrix.module)) != '' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: actionlint -color

  gate:
    name: Go gate
    if: always()
    needs: [modules, test, race, lint, vulnerabilities, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all Go checks
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          jq -e 'all(.[]; . == "success")' <<< "$RESULTS"
