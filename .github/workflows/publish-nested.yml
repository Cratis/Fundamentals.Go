# Nested modules release explicitly; publish.yml remains the automatic root path.
name: Publish nested module

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Allow-listed directory (for example tools or integrations/example)'
        type: string
        required: true
      bump:
        description: 'Bump declared in the merged release PR title'
        type: choice
        options: [patch, minor, major]
        required: true
      pr:
        description: 'Release PR merged at this main commit: release(<module>): <bump>'
        type: string
        required: true

permissions:
  contents: read

# Shared with root Publish: never race two release-action post hooks.
concurrency:
  group: go-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ref:
    name: Require main
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main

  verify:
    needs: ref
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  markdown:
    needs: ref
    uses: ./.github/workflows/markdown-verification.yml
    permissions:
      contents: read

  release:
    needs: [verify, markdown]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      issues: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      module: ${{ steps.plan.outputs.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate PR intent and plan one independently versioned module
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODULE: ${{ inputs.module }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_PR: ${{ inputs.pr }}
          MAX_MAJOR: ${{ vars.GO_RELEASE_MAJOR_CEILING || '0' }}
        run: python3 -B .github/scripts/nested_release.py
      # Explicit version avoids the action treating root releases as a nested
      # module's predecessor. Its idempotency is repository-wide by commit, so
      # the preflight requires a dedicated release PR/commit for each module.
      - name: Prepare the nested release
        id: release
        if: steps.plan.outputs.publish == 'true'
        uses: Cratis/release-action@63dd1239df24ac5da1a41378a4eee7f92ecc0796 # v1.4.1
        with:
          version: ${{ steps.plan.outputs.version }}
          tag-prefix: ${{ steps.plan.outputs.prefix }}
          release-notes: ${{ steps.plan.outputs.notes }}
      - name: Require the exact planned decision before the post hook can tag
        if: steps.plan.outputs.publish == 'true'
        env:
          SHOULD_PUBLISH: ${{ steps.release.outputs.should-publish }}
          REASON: ${{ steps.release.outputs.reason }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_VERSION: ${{ steps.plan.outputs.version }}
          EXPECTED_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          test "$SHOULD_PUBLISH" = true
          test "$REASON" = release
          test "$PRERELEASE" = false
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$TAG" = "$EXPECTED_TAG"

  verify-release:
    # Runs AFTER release-action's success-only post hook, including on retries.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the release and actual Git tag target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag")
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' <<< "$release"
          target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$encoded_tag" --jq .sha)
          test "$target" = "$GITHUB_SHA"

  index-module:
    needs: [release, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODULE_PATH: ${{ needs.release.outputs.module }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      # Go proxy versions are vX.Y.Z; only Git tags carry the subdirectory.
      MODULE_VERSION: v${{ needs.release.outputs.version }}
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
      GO111MODULE: 'on'
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      # No checkout: resolution must not use a local module or workspace.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Isolate the public module cache
        run: printf 'GOMODCACHE=%s/published-module-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Fetch the released version through the public Go proxy
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for attempt in 1 2 3; do
            if timeout 30s go list -m -json "$MODULE_PATH@$MODULE_VERSION" > "$RUNNER_TEMP/module.json"; then
              success=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          if [ "$success" != true ]; then
            echo '::error::Tag exists, but public proxy fetch failed. Rerun failed jobs; do not move/delete the tag.'
            exit 1
          fi
          jq -e --arg module "$MODULE_PATH" --arg version "$MODULE_VERSION" \
            '.Path == $module and .Version == $version' "$RUNNER_TEMP/module.json"
      - name: Download and checksum the published module archive
        run: timeout 60s go mod download -json "$MODULE_PATH@$MODULE_VERSION"
      - name: Request the versioned Go documentation page
        shell: bash
        run: |
          url="https://pkg.go.dev/$MODULE_PATH@$MODULE_VERSION"
          status=$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$url") || status=000
          if [ "$status" != 200 ]; then
            printf '::warning::pkg.go.dev returned %s; indexing was requested via the public proxy. Check %s later.\n' "$status" "$url"
          fi
          printf 'Git tag: %s\n\nGo module: %s@%s\n\nDocumentation: %s\n' "$RELEASE_TAG" "$MODULE_PATH" "$MODULE_VERSION" "$url" >> "$GITHUB_STEP_SUMMARY"
