version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:23'
      timezone: Etc/UTC
    labels: [dependencies, no-release]
    open-pull-requests-limit: 5
    groups:
      go-non-major:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /recipes
    schedule:
      interval: weekly
      day: monday
      time: '04:31'
      timezone: Etc/UTC
    labels: [dependencies, no-release]
    open-pull-requests-limit: 5
    groups:
      go-non-major:
        update-types: [minor, patch]
    ignore:
      # Recipes test this checkout through v0.0.0 and the local-root replace.
      - dependency-name: github.com/cratis/fundamentals.go
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:41'
      timezone: Etc/UTC
    labels: [dependencies, no-release]
    open-pull-requests-limit: 5
    groups:
      actions-non-major:
        update-types: [minor, patch]
